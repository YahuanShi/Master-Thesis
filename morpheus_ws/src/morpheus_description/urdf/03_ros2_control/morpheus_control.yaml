controller_manager:
  ros__parameters:
  
    update_rate: 100  # Hz

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController
      
    suspension_controller:
      type: forward_command_controller/ForwardCommandController
      
    robotic_arm_controller:
      type: forward_command_controller/ForwardCommandController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    morpheus_drive_controller:
      type: morpheus_control/MorpheusDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

forward_velocity_controller:
  ros__parameters:
    joints:
      - wheel_fl_joint
      - wheel_fr_joint
      - wheel_rl_joint
      - wheel_rr_joint
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

forward_position_controller:
  ros__parameters:
    joints:
      - steering_fl_joint
      - steering_fr_joint
      - steering_rl_joint
      - steering_rr_joint
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
 
suspension_controller:
  ros__parameters:
    joints:
      - shaft_left_joint
    interface_name: position

robotic_arm_controller:
  ros__parameters:
    joints:
      - arm_base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - gripper_left_joint
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

arm_trajectory_controller:
  ros__parameters:
    joints:
      - arm_base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

gripper_trajectory_controller:
  ros__parameters:
    joints:
      - gripper_left_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

morpheus_drive_controller:
  ros__parameters:
    wheel_base: 1.072
    wheel_radius: 0.125
    wheel_separation: 0.615
    wheel_steering_y_offset: 0.0
    drive_gain: 10.0
    deadzone: 0.05
    steering_joints:
      - steering_fl_joint
      - steering_fr_joint
      - steering_rl_joint
      - steering_rr_joint
    wheel_joints:
      - wheel_fl_joint
      - wheel_fr_joint
      - wheel_rl_joint
      - wheel_rr_joint
    publish_odom: true
    publish_odom_tf: false
    odom_frame: odom
    base_frame: chassis_link

