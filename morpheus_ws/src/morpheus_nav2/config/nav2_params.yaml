amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: chassis_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.2
    odom_alpha4: 0.2
    update_min_d: 0.1
    update_min_a: 0.1
    transform_tolerance: 0.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 4.0
      z: 0.0
      yaw: 0.0
    # In simulation the EKF already fuses Gazebo ground truth (/gz/odom).
    # odom frame = world frame, so map→odom is identity — published by
    # the static_map_odom node in bringup_nav2.launch.py.
    # AMCL runs (lifecycle mgr requires it) but must NOT override that TF.
    tf_broadcast: false

bt_navigator:
  ros__parameters:
    use_sim_time: True
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - morpheus_is_aruco_detected_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 4.0
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.5
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      max_angular_accel: 1.2
      lookahead_dist: 1.2
      min_lookahead_dist: 0.6
      max_lookahead_dist: 3.0
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading: false           # 连续圆弧转向，避免走走停停
      allow_reversing: false
      transform_tolerance: 0.2
      use_interpolation: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.8
      cost_scaling_gain: 1.0
      curvature_lookahead_dist: 1.2
      min_curvature: 0.0
      max_curvature: 1.0

    min_x_velocity_threshold: 0.01


planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      max_rotational_vel: 1.2
      min_rotational_vel: 0.4
      rotational_acc_lim: 1.5
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      w_eucl_dist: 1.0
      w_curvature: 0.5
      w_smoothness: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True

global_costmap:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: chassis_link
    update_frequency: 2.0
    publish_frequency: 1.0
    resolution: 0.12          # 原图 0.012207，可略粗以提速
    rolling_window: false
    width: 50.0
    height: 50.0
    robot_radius: 0.41
    footprint: ""
    plugins: ["static_layer", "voxel_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: True
      observation_sources: scan3d scan2d depth_cam
      scan3d:
        topic: /scan/points/obstacles
        max_obstacle_height: 3.0
        min_obstacle_height: 0.0
        clearing: True
        marking: True
        data_type: "PointCloud2"
        raytrace_max_range: 8.0
        obstacle_max_range: 6.0
      scan2d:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"
        inf_is_valid: True
      depth_cam:
        topic: /camera_2i/points
        max_obstacle_height: 2.5
        min_obstacle_height: 0.1
        clearing: True
        marking: True
        data_type: "PointCloud2"
        raytrace_max_range: 10.0
        obstacle_max_range: 8.0
      origin_z: 0.0
      z_resolution: 0.2
      z_voxels: 10
      publish_voxel_map: True
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.7
      cost_scaling_factor: 2.5

local_costmap:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: chassis_link
    update_frequency: 10.0
    publish_frequency: 5.0
    rolling_window: true
    width: 10.0
    height: 10.0
    resolution: 0.05
    robot_radius: 0.41
    footprint: ""
    plugins: ["voxel_layer", "inflation_layer"]
    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: True
      observation_sources: scan3d scan2d depth_cam
      scan3d:
        topic: /scan/points/obstacles
        max_obstacle_height: 3.0
        min_obstacle_height: 0.0
        clearing: True
        marking: True
        data_type: "PointCloud2"
        raytrace_max_range: 8.0
        obstacle_max_range: 6.0
      scan2d:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"
        inf_is_valid: True
      depth_cam:
        topic: /camera_2i/points
        max_obstacle_height: 2.5
        min_obstacle_height: 0.1
        clearing: True
        marking: True
        data_type: "PointCloud2"
        raytrace_max_range: 10.0
        obstacle_max_range: 8.0
      origin_z: 0.0
      z_resolution: 0.2
      z_voxels: 10
      publish_voxel_map: True
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.5
      cost_scaling_factor: 3.0

map_server:
  ros__parameters:
    use_sim_time: True
    # yaml_filename 由 bringup_nav2.launch.py 注入；此处留空更稳

lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    bond_timeout: 0.0
    node_names:
      - map_server
      - amcl
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - smoother_server
