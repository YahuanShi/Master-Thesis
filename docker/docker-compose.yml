services:
  morpheus:
    build:
      context: .
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: morpheus-sim
    container_name: morpheus-sim
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # CycloneDDS 0.9.x defaults MaxAutoParticipantIndex=9 (10 participants max).
      # Morpheus stack has 30+ nodes — raise the limit without re-specifying the
      # interface (ROS_LOCALHOST_ONLY=1 owns that; duplicating it causes "lo: same
      # interface may not be selected twice" and domain-creation failure).
      - CYCLONEDDS_URI=<CycloneDDS><Domain><Discovery><MaxAutoParticipantIndex>200</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/workspace/Morpheus
    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]
